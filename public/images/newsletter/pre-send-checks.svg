<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550"><rect width="900" height="550" rx="24" fill="#f0f7f5"/><text x="38" y="58" fill="#133f36" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Review the email your readers will receive</text><g transform="translate(32,88)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">EVIDENCE + VOICE</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Can you support every claim?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Open sources. Remove invented experience.</text></g><g transform="translate(32,236)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">INBOX + LINKS</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Does the actual email work?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Test on a phone. Click each destination.</text></g><g transform="translate(32,384)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">AUDIENCE + PERMISSION</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Is this the intended list?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Check segment, sender, and unsubscribe.</text></g></svg>