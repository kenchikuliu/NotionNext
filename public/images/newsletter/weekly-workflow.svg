<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550"><rect width="900" height="550" rx="24" fill="#f0f7f5"/><text x="38" y="58" fill="#133f36" font-family="Arial,sans-serif" font-size="31" font-weight="bold">One issue, four deliberate steps</text><g transform="translate(32,88)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">01  COLLECT</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Keep the evidence</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Save source links and your observations.</text></g><g transform="translate(32,236)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">02  DRAFT</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Answer one question</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Use your brief, voice sample, and prompt.</text></g><g transform="translate(32,384)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">03  REVIEW → 04  SEND</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Approve before publishing</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="25">Verify claims, then test the actual email.</text></g></svg>