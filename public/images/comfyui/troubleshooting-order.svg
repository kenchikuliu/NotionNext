<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550"><rect width="900" height="550" rx="24" fill="#f0f7f5"/><text x="38" y="58" fill="#133f36" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Check the first failure in order</text><g transform="translate(32,88)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">MODEL</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Does the requested file exist?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="24">Check filename, folder and completed download.</text></g><g transform="translate(32,236)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">NODES + INPUTS</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Does the graph have what it needs?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="24">Check node packages and matching input types.</text></g><g transform="translate(32,384)"><rect width="836" height="132" rx="14" fill="white"/><rect width="7" height="132" rx="3" fill="#28745e"/><text x="25" y="31" fill="#28745e" font-family="Arial,sans-serif" font-size="18" font-weight="bold">MEMORY</text><text x="25" y="67" fill="#163c35" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Does the workload fit?</text><text x="25" y="105" fill="#435f58" font-family="Arial,sans-serif" font-size="24">Try the example size and a batch of one image.</text></g></svg>